services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sonora
      POSTGRES_USER: sonora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonora_password}
      POSTGRES_HOST_AUTH_METHOD: "trust"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - profiles:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonora -d sonora"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://sonora:${POSTGRES_PASSWORD:-sonora_password}@db:5432/sonora
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
      MUSIC_USER_AGENT: ${MUSIC_USER_AGENT:-Sonora/1.0 (local development)}
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - music:/data/music
      # - ./.certs/ca-bundle.pem:/etc/ssl/certs/ca-certificates.crt:ro,z
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  profiles:
  music:
