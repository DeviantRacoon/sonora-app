services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sonora
      POSTGRES_USER: sonora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonora-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - profiles:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonora -d sonora"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://sonora:${POSTGRES_PASSWORD:-sonora-local}@db:5432/sonora
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
      MUSIC_USER_AGENT: ${MUSIC_USER_AGENT:-Sonora/1.0 (local development)}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - music:/data/music
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
volumes:
  profiles:
  music:
